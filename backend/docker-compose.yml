# Docker Compose configuration cho TodoList Collaboration Project
# Version: Docker Compose V2 (không cần khai báo version)

services:
  # ============================================
  # PostgreSQL Database Service
  # ============================================
  postgres:
    image: postgres:16-alpine # Image PostgreSQL phiên bản 16 với Alpine Linux (nhẹ hơn ~5x so với bản full)

    container_name: ccnlthd_postgres # Tên container - dễ nhận diện khi dùng docker ps

    # Chính sách restart:
    # - "no": không restart (default)
    # - "always": luôn restart
    # - "on-failure": restart khi exit code != 0
    # - "unless-stopped": restart trừ khi bị stop thủ công
    restart: unless-stopped

    # Biến môi trường cho PostgreSQL
    environment:
      POSTGRES_USER: postgres # Username để đăng nhập database

      POSTGRES_PASSWORD: 123 # Password cho user trên (KHÔNG dùng password yếu trong production!)

      POSTGRES_DB: CCNLTHD_postgres # Tên database sẽ được tạo tự động khi container khởi động

    # Port mapping: HOST_PORT:CONTAINER_PORT
    # - Container PostgreSQL chạy ở port 5432 (default)
    # - Map ra host port 5433 để tránh conflict với PostgreSQL local (nếu có)
    ports:
      - "5433:5432"

    # Volume để persist data - data không bị mất khi container bị xóa
    # Nếu không có volume, xóa container = mất hết data!
    volumes:
      - ccnlthd_postgres_data:/var/lib/postgresql/data

    # Network để các container khác có thể kết nối
    networks:
      - ccnlthd

# ============================================
# Named Volumes - Lưu trữ persistent data
# ============================================
volumes:
  # Volume cho PostgreSQL data
  # Docker tự quản lý location trên host
  ccnlthd_postgres_data:

    # ============================================
    # Networks - Mạng nội bộ giữa các containers
    # ============================================
networks:
  # Custom bridge network cho project
  # Các container trong cùng network có thể gọi nhau bằng tên service
  # Ví dụ: từ backend container có thể kết nối postgres:5432
  ccnlthd:
    driver: bridge
