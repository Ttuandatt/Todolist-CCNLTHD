<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList CCNLTHD - Fullstack Environment</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--primary), #ec4899, var(--primary));
            border-radius: 1.6rem;
            z-index: -1;
            opacity: 0.3;
            filter: blur(10px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-badge span {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            70% { transform: scale(1.2); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }

        .links {
            display: grid;
            gap: 1rem;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 0.75rem;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .link-label {
            font-weight: 500;
        }

        .link-url {
            color: var(--primary);
            font-size: 0.875rem;
            font-family: monospace;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-badge">
            <span></span> Docker Stack is Online
        </div>
        <h1>TodoList Fullstack</h1>
        <p>Môi trường phát triển của bạn đã sẵn sàng và hoạt động ổn định.</p>
        
        <div class="links">
            <a href="http://localhost:3333/api-docs" class="link-card" target="_blank">
                <span class="link-label">Backend API Swagger</span>
                <span class="link-url">:3333/api-docs</span>
            </a>
            <a href="#" class="link-card">
                <span class="link-label">Frontend (Current)</span>
                <span class="link-url">:80</span>
            </a>
            <a href="https://github.com" class="link-card" target="_blank">
                <span class="link-label">Project Documentation</span>
                <span class="link-url">README.md</span>
            </a>
        </div>

        <div class="footer">
            Bất cứ khi nào bạn sẵn sàng, hãy thay thế nội dung thư mục <b>frontend/</b> bằng mã nguồn thực tế của bạn.
        </div>
    </div>
</body>
</html>
